# 고객이 쓰는 말 → 지식 문서가 쓰는 말.
# 질의에 when 의 표현이 하나라도 있으면 add 의 단어를 질의 뒤에 덧붙여 검색한다(문서는 건드리지 않는다).
#
# 만드는 기준: 개발용 검색 자료(data/evals/retrieval/dev.jsonl)에서 놓친 질의와 상담 도메인의
# 일반적인 표현만 보고 채운다. 평가용(test) 자료를 보고 항목을 더하지 않는다.
- when: ["안 와", "안와", "안 옴", "안옴", "못 받", "아직도 안", "소식이 없"]
  add: "배송 지연 출고 지연 배송 중 멈춤"
- when: ["어디쯤", "어디까지", "어디 있", "어디서 봐", "위치"]
  add: "배송 조회 운송장"
- when: ["언제 와", "언제와", "며칠 걸", "얼마나 걸", "언제 도착", "언제쯤 와", "언제 받"]
  add: "배송 기간 출고 시점"
- when: ["뜯", "열어 봤", "열어봤", "까 봤", "까봤", "포장 벗"]
  add: "포장 개봉 밀봉 스티커 반품"
- when: ["돌려보내", "돌려 보내", "무르", "물리고"]
  add: "반품"
- when: ["돈 언제", "돈은 언제", "돈이 언제", "돈 들어", "언제 들어와", "언제 입금"]
  add: "환불 처리 시점 결제수단별 반영 기간"
- when: ["주소"]
  add: "배송지 변경"
- when: ["바꾸고", "바꿔", "바꿀"]
  add: "교환 변경"
- when: ["망가", "고장", "깨져", "깨진", "부서", "안 켜", "안켜", "작동"]
  add: "불량 파손 초기불량 A/S"
- when: ["상했", "상해서", "썩", "물러", "곰팡", "터져"]
  add: "신선식품 품질 문제"
- when: ["사람이랑", "직원", "통화"]
  add: "상담원 운영 시간"
- when: ["포인트", "마일리지"]
  add: "적립금"
- when: ["섬", "울릉", "산간"]
  add: "도서산간 추가 배송비"
- when: ["공짜", "배송비 안"]
  add: "무료배송 기준"
- when: ["새겨", "이름 넣", "문구 넣"]
  add: "주문제작 각인"
- when: ["계정 삭제", "계정 없애", "그만 쓰"]
  add: "회원 탈퇴"
- when: ["두 번 결제", "두번 결제", "이중", "중복 결제"]
  add: "결제 오류 이중 결제"
- when: ["안 맞", "마음에 안", "별로", "필요 없"]
  add: "단순변심 반품"
