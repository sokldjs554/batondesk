<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>운영 화면 — BatonDesk</title>
    <link rel="stylesheet" href="/static/fonts/pretendard/pretendard.css" />
    <link rel="stylesheet" href="/static/app.css?v=3" />
  </head>
  <body>
    <main class="page">
      <div class="ops-head">
        <div>
          <span class="eyebrow">운영자</span>
          <h1>상담이 잘 돌아가고 있는가</h1>
          <p class="muted">해결 여부, 상담원 인계, 근거 검사에 걸린 답변, 응답 시간, 모델·도구 호출을 이 서버의 기록에서 집계합니다.</p>
        </div>
        <button class="btn btn-s" type="button" id="btn-refresh">새로 고침</button>
      </div>

      <div class="tabs" id="tabs" role="tablist" aria-label="운영 화면 구역"></div>
      <div class="filters hidden" id="filters" aria-label="집계 대상"></div>

      <section id="tab-overview"></section>
      <section id="tab-review" class="hidden"></section>
      <section id="tab-prompts" class="hidden"></section>
      <section id="tab-logs" class="hidden"></section>
    </main>
    <script type="module" src="/static/ops.js"></script>
  </body>
</html>
