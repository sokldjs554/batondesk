<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>상담원 화면 — BatonDesk</title>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <main class="page">
      <div class="desk-head">
        <div>
          <span class="eyebrow" style="color: var(--coral-deep)">상담원</span>
          <h1>AI가 넘긴 대화</h1>
          <p class="muted" style="margin-top: 6px">요약, 대화 이력, 검색 근거, 도구 결과, 넘어온 이유를 확인하고 이어서 답합니다. 데모라 로그인 없이 누구나 상담원 역할을 할 수 있습니다.</p>
        </div>
        <label class="agent-name">상담원 이름 <input id="agent-name" maxlength="20" autocomplete="off" /></label>
      </div>

      <div class="tabs" id="tabs" role="tablist" aria-label="인계 상태"></div>
      <div class="rail" id="rail" aria-label="인계 목록"></div>
      <div id="detail"></div>
    </main>
    <script type="module" src="/static/desk.js"></script>
  </body>
</html>
