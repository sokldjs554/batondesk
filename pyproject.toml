[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "batondesk"
version = "0.1.0"
description = "고객 상담 AI 에이전트 — 지식 검색·도구 호출·근거 확인·상담원 인계 (예시 쇼핑몰 데이터)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "langgraph>=1.0",
  "kiwipiepy>=0.20",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
batondesk = "batondesk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/batondesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/batondesk"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["kiwipiepy.*", "langgraph.*"]
ignore_missing_imports = true
